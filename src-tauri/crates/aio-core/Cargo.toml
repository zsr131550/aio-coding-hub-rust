[package]
name = "aio-core"
version = "0.60.13"
edition = "2021"
publish = false

[dependencies]
aio-contract = { path = "../aio-contract" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
