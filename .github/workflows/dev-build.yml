name: dev-build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.90.0
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (Windows, portable)
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $targetDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $exePath = Join-Path $targetDir "AIO Coding Hub.exe"
          if (-not (Test-Path $exePath)) {
            $exePath = Join-Path $targetDir "aio-coding-hub.exe"
          }
          if (-not (Test-Path $exePath)) {
            Write-Error "Cannot find built exe"
            Get-ChildItem $targetDir -Filter "*.exe" | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          $portableDir = "dev-build/AIO Coding Hub"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item $exePath $portableDir

          $resourceDir = Join-Path $targetDir "resources"
          if (Test-Path $resourceDir) {
            Copy-Item -Recurse $resourceDir (Join-Path $portableDir "resources")
          }

          $sha = "${{ github.sha }}".Substring(0, 7)
          $zipName = "aio-coding-hub-dev-win64-${sha}.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "dev-build/$zipName" -Force
          Write-Host "Created: dev-build/$zipName"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-build-win64
          path: dev-build/*.zip
          retention-days: 7
